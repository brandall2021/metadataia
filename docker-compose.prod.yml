name: metadato-prod

# ====================================================================
# METADATAIA - Compose de PRODUCCION (FASE 18)
#
# Pensado para deploy en Dokploy (genera el proxy/HTTPS del dominio).
# NO publica secretos por defecto: falta el .env y falla el arranque.
# Todos los secretos y el dominio se toman del .env:
#   DOMAIN=miapp.dominio.gob.ar        (subdominio/dominio de Dokploy)
#   POSTGRES_PASSWORD=... APP_SECRET_KEY=... JWT_SECRET=...
#   MINIO_ACCESS_KEY=... MINIO_SECRET_KEY=...
#
# El proyecto usa nombre propio "metadato-prod" para convivir con el
# stack de desarrollo sin colisionar nombres de contenedores.
# ====================================================================

services:
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metadataia}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-metadataia}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # En hosts con kernel < 4.8 (p. ej. CentOS 7, kernel 3.10) el seccomp
    # por defecto de Docker bloquea un syscall de Postgres (EPERM al
    # escribir postmaster.pid / pg_wal). Se deja ACTIVO porque es
    # inofensivo en kernels modernos y requerido en los antiguos.
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metadataia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-metadataia}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metadataia} -d ${POSTGRES_DB:-metadataia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY en .env}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metadataia}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-metadataia}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Defina APP_SECRET_KEY en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ORIGINS: https://${DOMAIN:?Defina DOMAIN en .env (p. ej. miapp.dominio.gob.ar)}
      STORAGE_BACKEND: s3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY en .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY en .env}
      MINIO_BUCKET: metadataia
      DEFAULT_MAX_FILE_SIZE_MB: ${DEFAULT_MAX_FILE_SIZE_MB:-100}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-spa+eng+por}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      DSPACE_TIMEOUT_SECONDS: ${DSPACE_TIMEOUT_SECONDS:-120}
      AUTO_OCR: ${AUTO_OCR:-true}
      AUTO_AI: ${AUTO_AI:-true}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: celery -A app.jobs.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metadataia}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-metadataia}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Defina APP_SECRET_KEY en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      STORAGE_BACKEND: s3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY en .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY en .env}
      MINIO_BUCKET: metadataia
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?Defina DOMAIN en .env (p. ej. miapp.dominio.gob.ar)}/api
        API_INTERNAL_URL: http://api:8000
    environment:
      # Rewrite /api -> backend dentro de la red del stack (Dokploy: misma
      # URL publica para frontend y API, sin CORS ni subdominios extra).
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - api

volumes:
  pg_data:
  minio_data: