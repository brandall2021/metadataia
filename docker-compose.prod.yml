name: metadato-prod

# ====================================================================
# METADATAIA - Compose de PRODUCCION (FASE 18)
#
# Pensado para deploy en Dokploy (genera el proxy/HTTPS del dominio).
# NO publica secretos por defecto: falta el .env y falla el arranque.
# Todos los secretos y el dominio se toman del .env / env vars de Dokploy:
#   DOMAIN=miapp.dominio.gob.ar        (subdominio/dominio de Dokploy)
#   DATABASE_URL=... REDIS_URL=...     (servicios externos compartidos)
#   APP_SECRET_KEY=... JWT_SECRET=...
#   MINIO_ACCESS_KEY=... MINIO_SECRET_KEY=...
#
# PostgreSQL y Redis son SERVICIOS EXTERNOS compartidos (se reutiliza la
# infra ya desplegada en Dokploy): DATABASE_URL apunta a basededato-6cfbai
# y REDIS_URL a diarionoticia-redis-adtycq. Por eso no se definen aqui
# servicios postgres/redis propios. Minio sigue siendo interno (almacena
# los binarios/PDFs de metadataia).
#
# El proyecto usa nombre propio "metadato-prod" para convivir con el
# stack de desarrollo sin colisionar nombres de contenedores.
# ====================================================================

services:
  # Crea la base de datos 'repositorio' en el PostgreSQL externo compartido
  # si aun no existe (idempotente). El usuario necesita permiso CREATEDB.
  db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: ${DB_HOST:?Defina DB_HOST (postgres externo)}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:?Defina DB_USER (postgres externo)}
      PGPASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD (postgres externo)}
    command: ["/bin/sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname='repositorio'\" | grep -q 1 || psql -c 'CREATE DATABASE repositorio'"]

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL en las env vars del servicio}
    depends_on:
      db-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY en .env}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL en las env vars del servicio}
      REDIS_URL: ${REDIS_URL:?Defina REDIS_URL en las env vars del servicio}
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Defina APP_SECRET_KEY en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ORIGINS: https://${DOMAIN:?Defina DOMAIN en .env (p. ej. miapp.dominio.gob.ar)}
      STORAGE_BACKEND: s3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY en .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY en .env}
      MINIO_BUCKET: metadataia
      DEFAULT_MAX_FILE_SIZE_MB: ${DEFAULT_MAX_FILE_SIZE_MB:-100}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-spa+eng+por}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      DSPACE_TIMEOUT_SECONDS: ${DSPACE_TIMEOUT_SECONDS:-120}
      AUTO_OCR: ${AUTO_OCR:-true}
      AUTO_AI: ${AUTO_AI:-true}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: celery -A app.jobs.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL en las env vars del servicio}
      REDIS_URL: ${REDIS_URL:?Defina REDIS_URL en las env vars del servicio}
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Defina APP_SECRET_KEY en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      STORAGE_BACKEND: s3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY en .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY en .env}
      MINIO_BUCKET: metadataia
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?Defina DOMAIN en .env (p. ej. miapp.dominio.gob.ar)}/api
        API_INTERNAL_URL: http://api:8000
    environment:
      # Rewrite /api -> backend dentro de la red del stack (Dokploy: misma
      # URL publica para frontend y API, sin CORS ni subdominios extra).
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - api

volumes:
  minio_data: