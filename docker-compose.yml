name: metadato

services:
  postgres:
    image: postgres:16-alpine
    # Necesario en hosts con kernel 3.10 (CentOS 7): el seccomp por defecto
    # de Docker bloquea un syscall de Postgres (EPERM al escribir
    # postmaster.pid / pg_wal). Restriccion solo de entorno de desarrollo.
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metadataia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metadataia}
      POSTGRES_DB: ${POSTGRES_DB:-metadataia}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metadataia} -d ${POSTGRES_DB:-metadataia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-metadataia}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-metadataia-secret}
    volumes:
      - ./data/minio:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metadataia}:${POSTGRES_PASSWORD:-metadataia}@postgres:5432/${POSTGRES_DB:-metadataia}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-secret-de-desarrollo}
      JWT_SECRET: ${JWT_SECRET:-secret-jwt-de-desarrollo}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: celery -A app.jobs.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metadataia}:${POSTGRES_PASSWORD:-metadataia}@postgres:5432/${POSTGRES_DB:-metadataia}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-secret-de-desarrollo}
      JWT_SECRET: ${JWT_SECRET:-secret-jwt-de-desarrollo}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/public:/app/public
    depends_on:
      - api