[project]
name = "metadataia-backend"
version = "0.1.0"
description = "Sistema de extraccion, normalizacion, validacion y deposito de metadatos desde documentos PDF mediante OCR + Agentes de IA + SNRD + DSpace 9"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "SQLAlchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "python-multipart>=0.0.9,<1.0",
    "PyJWT>=2.8,<3.0",
    "bcrypt>=4.1,<5.0",
    "cryptography>=42.0,<44.0",
    "boto3>=1.34,<2.0",
    "httpx>=0.27,<1.0",
    "email-validator>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"