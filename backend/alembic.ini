# Configuracion de Alembic para migraciones de base de datos.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# La URL se reemplaza en tiempo de ejecucion por app.core.config.settings
sqlalchemy.url = postgresql+psycopg://metadataia:metadataia@postgres:5432/metadataia

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S